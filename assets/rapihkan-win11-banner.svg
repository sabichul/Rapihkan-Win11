<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Rapihkan Win11</title>
  <desc id="desc">Dark-blue banner for a Windows 11 cleanup tool</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061b33"/>
      <stop offset="1" stop-color="#0a3658"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#75d6ff" stroke-opacity=".13"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="1110" cy="70" r="190" fill="#00b7e8" fill-opacity=".12"/>
  <circle cx="1190" cy="310" r="130" fill="#72e1bd" fill-opacity=".08"/>
  <g transform="translate(94 82)">
    <rect x="0" y="0" width="116" height="116" rx="24" fill="#0d4f76" stroke="#75d6ff" stroke-width="2"/>
    <path d="M32 83h48M39 70h34M46 57h20" stroke="#e4f7ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M76 34l12 12-37 37-16 3 3-16z" fill="#72e1bd"/>
  </g>
  <text x="242" y="135" fill="#f3fbff" font-family="Segoe UI, sans-serif" font-size="64" font-weight="700">Rapihkan Win11</text>
  <text x="246" y="184" fill="#a9d9ef" font-family="Segoe UI, sans-serif" font-size="25">Inspect • understand • organize files with full control</text>
  <g transform="translate(246 222)">
